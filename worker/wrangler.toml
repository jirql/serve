name = "www"
main = "_worker.js"
compatibility_date = "2026-09-01"

[vars]
# 订阅路径 token, 与 Vercel 端 SUB_PATH 保持一致 (实际值不入库: 见 Vercel env / 本地 .env)
SUB_PATH = "REPLACE_WITH_SUB_PATH"

# 以下两项用 secret 注入, 不要写进本文件:
#   wrangler secret put VERCEL_DOMAINS   # 例: a.vercel.app,b.vercel.app
#   wrangler secret put SUB_TOKEN        # 订阅鉴权 key, 与 Vercel 端一致

[triggers]
crons = ["*/5 * * * *"]
